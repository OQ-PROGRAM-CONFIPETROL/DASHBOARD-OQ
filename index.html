<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Dashboard OQ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#0b2340;
  color:#fff;
  padding:20px;
}

h1{
  text-align:center;
  margin-bottom:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:#fff;
  color:#111;
  padding:25px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 10px 20px rgba(0,0,0,.25);
}

.card h2{
  margin:0;
  font-size:18px;
}

.card .valor{
  font-size:42px;
  font-weight:bold;
  margin-top:15px;
}

.graficas{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

.box{
  background:#fff;
  border-radius:16px;
  padding:20px;
}

canvas{
  width:100% !important;
  height:400px !important;
}

@media(max-width:900px){
  .graficas{
    grid-template-columns:1fr;
  }
}

</style>
</head>

<body>

<h1>DASHBOARD OQ CONFIPETROL</h1>

<div class="cards">

  <div class="card">
    <h2>% Cumplimiento</h2>
    <div class="valor" id="porcentaje">0%</div>
  </div>

  <div class="card">
    <h2>Registros</h2>
    <div class="valor" id="total">0</div>
  </div>

  <div class="card">
    <h2>Vigentes</h2>
    <div class="valor" id="vigente">0</div>
  </div>

  <div class="card">
    <h2>Vencidas</h2>
    <div class="valor" id="vencida">0</div>
  </div>

  <div class="card">
    <h2>Pendientes</h2>
    <div class="valor" id="pendiente">0</div>
  </div>

</div>

<div class="graficas">

  <div class="box">
    <canvas id="graficaEstados"></canvas>
  </div>

  <div class="box">
    <canvas id="graficaCargos"></canvas>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbxbzO1J8Dl0v4_NZ624FL9U7i4uIZzFhztAft7eyOWyQoGdR59VCxlpjUwrmgbIkZcKYA/exec";

fetch(API + "?dashboard=cumplimiento")
.then(r => r.json())
.then(data => {

  document.getElementById("porcentaje").textContent =
    data.porcentajeGeneral + "%";

  document.getElementById("total").textContent =
    data.total;

  document.getElementById("vigente").textContent =
    data.vigente;

  document.getElementById("vencida").textContent =
    data.vencida;

  document.getElementById("pendiente").textContent =
    data.pendiente;

  // GRAFICA ESTADOS

  new Chart(document.getElementById("graficaEstados"), {

    type:'doughnut',

    data:{
      labels:[
        'Vigentes',
        'Vencidas',
        'Pendientes',
        'Próximas'
      ],

      datasets:[{
        data:[
          data.vigente,
          data.vencida,
          data.pendiente,
          data.proxima
        ]
      }]
    }

  });

  // GRAFICA CARGOS

  const cargos = data.cargos || [];

  new Chart(document.getElementById("graficaCargos"), {

    type:'bar',

    data:{
      labels:cargos.map(c => c.cargo),

      datasets:[{
        label:'% Cumplimiento',
        data:cargos.map(c => c.porcentaje)
      }]
    },

    options:{
      responsive:true,
      scales:{
        y:{
          beginAtZero:true,
          max:100
        }
      }
    }

  });

})
.catch(err => {
  console.error(err);
  alert("No fue posible cargar dashboard.");
});

</script>

</body>
</html>
